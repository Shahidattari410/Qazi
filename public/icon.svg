<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="emBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#087443" />
      <stop offset="100%" stop-color="#044326" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997300" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#emBg)" />
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-dasharray="16 8" opacity="0.85" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="8" />
  <circle cx="256" cy="256" r="160" fill="#065431" stroke="url(#goldGrad)" stroke-width="2" />
  
  <!-- 8-Point Star Islamic Motif -->
  <g transform="translate(256, 256) scale(1.15)">
    <polygon points="0,-110 32,-32 110,0 32,32 0,110 -32,32 -110,0 -32,-32" fill="none" stroke="url(#goldGrad)" stroke-width="4" />
    <polygon points="-78,-78 0,-45 78,-78 45,0 78,78 0,45 -78,78 -45,0" fill="none" stroke="url(#goldGrad)" stroke-width="4" />
  </g>

  <!-- Central Emblem Letter "ق" / Scales of Justice -->
  <text x="256" y="295" font-family="'Amiri', 'Noto Nastaliq Urdu', serif" font-size="130" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle">ق</text>

  <!-- Crown Arch / Crescent -->
  <path d="M 200 135 Q 256 100 312 135" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
  <circle cx="256" cy="115" r="7" fill="url(#goldGrad)" />
</svg>
